<!DOCTYPE html>
<html>
    
    <head>
        <title>Login</title>

        <style>
            body {
                font-family: 'Times New Roman', Times, serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            .login-box {
                background-color: white;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
                width: 300px;
            }

            h1 {text-align: center; color: navy;}

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }

            input {
                width: 100%;
                padding: 8px;
                margin-bottom: 15px;
                box-sizing: border-box;
            }

            button {
                width: 100%;
                padding: 10px;
                background-color: navy;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            button:hover {background-color: darkblue;}

            .error {
                color: red;
                text-align: center;
                margin-bottom: 10px;
            }
        </style>
    </head>

    <body>
        <div class="login-box">
            <h1>Login</h1>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label>Username</label>
                <input type="text" name="username" required>

                <label>Password</label>
                <input type="password" name="password" required>

                <button type="submit">Login</button>
            </form>
        </div>
    </body>

</html>
