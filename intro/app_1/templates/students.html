<!DOCTYPE html>
<html>
    <head>
        <title>
            Students
        </title>
    </head>

    <body>
        <h1 style: "color=green;">All Students:</h1>

        {% for s in students %}
            <h2 style: "color=green;">{{s.name}}</h2>
            <p>Age: {{s.age }}<br>
               Email: {{s.email}}<br>
               City: {{s.city}}<br>
               Course: {{s.course}}</p>
            <hr>
        {% endfor %}

    </body>
</html>
